# GoodsTrade English messages
# Supports legacy & color codes
# Placeholders:
#   %prefix%      plugin prefix (usually added by the plugin, not in the sentence)
#   %player%      player name
#   %target%      target player name
#   %amount%      payment amount with its unit
#   %currency%    selected currency name
#   %command%     subcommand name
#   %description% subcommand description
#   %label%       the main command the player typed (goodstrade or gt)

prefix: "&7[&2&lGoods&6&lTrade&7] &r"

command:
  help: "&7Available commands:"
  help-entry: "&e/%label% %command% &7- %description%"
  unknown: "&cUnknown subcommand. Use /%label% for help."
  no-permission: "&cYou don't have permission to use this command."
  player-only: "&cOnly players can use this command."
  usage:
    trade: "&eUsage: /%label% trade <sender> <receiver>"
    sendtrade: "&eUsage: /%label% sendtrade <player>"
    accept: "&eUsage: /%label% accept [player]"
    toggle: "&eUsage: /%label% toggle [true|false]"
    toggle-hint: "&7Leave out the value to switch your current setting."
    test: "&eUsage: /%label% test [test-name]"
  description:
    accept: "Accept a pending trade request"
    reload: "Reload configuration, language, and menu files"
    sendtrade: "Send a trade request to a player"
    test: "Open test mode and control both sides of a trade"
    toggle: "Enable or disable incoming trade requests"
    trade: "Start a trade between two online players as an administrator"

trade-request:
  already-pending: "&cA request to this player is still pending. Wait for acceptance or expiration."
  sent: "&7Trade request sent to &e%target%&7."
  received: "&e%player% &7wants to trade with you. &a[Click to accept]"
  received-shift-hint: " &7(Sneak + right-click them to reply)"
  hover: "Click to accept this trade"
  hover-shift: "Click this message, or sneak + right-click them to reply"
  cooldown: "&cYou're sending trade requests too quickly. Try again in a moment."
  target-closed: "&cThat player isn't accepting trade requests."
  no-pending: "&cYou don't have any pending trade requests."
  select-player: "&cMultiple requests pending. Use /%label% accept <player>."

trade-status:
  same-world-required: "&cBoth players must be in the same world. Trading cannot continue."
  start-too-far: "&cToo far apart to request or accept a trade. Move closer and try again."
  cancelled-by-distance: "&cTrade cancelled: players moved too far apart. Items returned."
  world-disabled: "&cTrading is not allowed in this world. Trading has been stopped."
  cancelled-by-damage: "&cA player took damage. Trade cancelled and items returned."
  money-rollback-failed: "&cTrade cancelled and items returned. Some payments could not be refunded; contact an administrator."
  opening: "&aOpening the trade menu..."
  success: "&aTrade complete!"
  cancelled-by-self: "&cYou cancelled the trade."
  cancelled-by-other: "&cThe other player cancelled the trade."
  cancelled-by-reload: "&cThe plugin is reloading, so your trade was cancelled."
  already-trading: "&cOne of the players is already in a trade or test mode."
  money-balance-changed: "&cTrade cancelled: a player's balance changed during the countdown. All items were returned."
  money-settlement-failed: "&cTrade cancelled: the payment failed. All items were returned."
  test-opening: "&eTest mode enabled. You control both sides. Currency and levels stay unchanged; items are returned when you finish."
  test-success: "&aTest complete. Items returned; currency and levels unchanged."
  test-cancelled: "&eTest mode closed. All items returned."

test-trade:
  invalid-name: "&cThe test name must contain 1-16 letters, numbers, or underscores."
  player-exists: "&cThat name belongs to an online player. Choose another test name."
  already-trading: "&cYou are already in a trade or test mode."

trade-gui:
  items-offer-changed: "&e%player% &7changed the items. Check the trade and confirm again."
  currency-locked: "&cBoth players must unconfirm before switching currencies."
  confirm: "&aOffer confirmed. Waiting for the other player..."
  unconfirm: "&cYou withdrew your confirmation."
  cancel-ready: "&cYou stopped the final confirmation countdown."
  trade-cancelled: "&eConfirmation cancelled. You can edit your offer again."
  items-locked: "&cYour offer is locked while confirmed."
  self-operation: "&cYou can only edit your own offer slots."
  confirm-in-progress: "&eThe trade is being confirmed. Use the cancel button if you need to stop it."
  blacklist-hit: "&cYour offer contains an item that cannot be traded."
  money-changed: "&aYour money offer is now &e%amount%&a."
  money-offer-changed: "&e%player% &7changed the money offer. Check the trade and confirm again."
  money-insufficient: "&c%player% cannot cover the required payment of %amount%."
  money-locked: "&cYour money offer is locked while confirmed."
  money-minimum: "&cMoney offers cannot go below zero."
  money-unavailable: "&cCurrency trading is currently unavailable."
  money-invalid: "&cThat amount is invalid or outside the supported range."

# Default trade menu labels. Explicit values in View.yml take priority.
trade-view:
  currency-selected: "&bCurrent type: %currency%"
  currency-switch: "&eLeft-click the center column to switch; existing offers are kept"
  unconfirmed-name: "&7Not confirmed"
  click-confirm-lore:
    - ""
    - "&aClick to confirm your offer"
  confirmed-name: "&eOffer confirmed"
  waiting-other-lore:
    - ""
    - "&aWaiting for the other player"
  countdown-name: "&bFinalizing trade..."
  countdown-lore:
    - ""
    - "&eCheck the other player's offer carefully"
    - "&6Click again to cancel if something looks wrong"
  other-cancelled-name: "&cConfirmation cancelled"
  restart-confirm-lore:
    - ""
    - "&eClick to start over; both players must confirm again"
  divider-name: "&7Trade guide"
  divider-lore:
    - ""
    - "&aThe sender places items on the left"
    - "&aThe receiver places items on the right"
    - "&eAdd your offer, then use the buttons below"
    - "&eChanging items or amounts requires confirmation again"
    - "&eBoth players must confirm before the countdown starts"
    - "&7Close the menu to cancel the trade"
  money-button-name: "&6Adjust amount: &e%amount%"
  money-button-lore:
    - ""
    - "&aLeft click: add %amount%"
    - "&cRight click: subtract %amount%"
  payment: "&6%player% must pay: &e%amount%"
  test-mode: "&bTest mode: currency and levels stay unchanged; items are returned"

trade-toggle:
  enabled: "&aTrade requests are now &2enabled&a."
  disabled: "&cTrade requests are now &4disabled&c."

player:
  offline: "&cThat player is offline."
  not-found: "&cThat player could not be found or is offline."
  self-trade: "&cYou can't trade with yourself."
  different-players: "&cA trade needs two different players."
  inv-full: "&eYour inventory was full, so the remaining items were dropped at your feet."

console:
  need-both-players: "Console must specify both the sender and receiver."

protection:
  trading: "&cThat player is currently trading and cannot be damaged."

security:
  exploit-attempt: "&cYou were kicked for attempting an unsafe chat payload."

reload:
  success: "&aGoodsTrade configuration reloaded."
