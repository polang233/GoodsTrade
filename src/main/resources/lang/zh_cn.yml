# GoodsTrade 多语言配置文件
# 支持 & 颜色代码
# 占位符说明:
#   %prefix% - 插件前缀
#   %player% - 玩家名称
#   %target% - 目标玩家名称

# 插件前缀
prefix: "&7[&2&lGoods&6&lTrade&7] &r"

# 命令相关
command:
  help: "&7可用命令："
  help-entry: "&e/gt %command% &7- %description%"
  unknown: "&c未知命令，请输入 /gt 查看帮助。"
  no-permission: "&c你没有权限执行此命令！"
  player-only: "&c该命令只能由玩家执行"
  usage:
    trade: "&a用法：/gt trade [发起者] [接收者]"
    sendtrade: "&a用法：/gt sendtrade [接收人]"
    toggle: "&c用法：/gt toggle [true|false]"
    toggle-hint: "&7不填参数则切换当前状态"
    test: "&a用法：/gt test [测试名称]"
  description:
    accept: "接受交易请求"
    reload: "重载配置、语言和界面文件"
    sendtrade: "向指定玩家发送交易请求"
    test: "打开测试模式，单人操作交易双方"
    toggle: "开启或关闭接收交易请求"
    trade: "为两名在线玩家打开交易界面"

# 交易请求相关
trade-request:
  already-pending: "&c已向该玩家发送请求，请等待对方接受或请求过期。"
  sent: "&7已向 &e%target% &7发送交易请求。"
  received: "&e%player% &7想与你交易。&a[点击接受]"
  hover: "点击接受交易"
  cooldown: "&c请求发送过于频繁，请稍后再试。"
  target-closed: "&c对方暂不接受交易请求。"
  no-pending: "&c没有可接受的交易请求，请让对方重新发送。"
  select-player: "&c有多条交易请求，请输入 /gt accept 玩家名。"

# 交易状态
trade-status:
  same-world-required: "&c交易双方必须在同一个世界，交易无法继续。"
  start-too-far: "&c双方距离过远，无法发起或接受交易，请靠近后重试。"
  cancelled-by-distance: "&c双方距离超过交易范围，交易已取消，物品已返还。"
  world-disabled: "&c交易双方必须位于允许交易的世界中，当前交易已停止。"
  cancelled-by-damage: "&c交易一方受到伤害，交易已取消，物品已返还。"
  money-rollback-failed: "&c交易取消，物品已返还；部分款项未能自动退回，请联系管理员核对。"
  opening: "&a正在打开交易界面……"
  success: "&a交易成功！"
  cancelled-by-self: "你取消了交易！"
  cancelled-by-other: "对方取消了交易！"
  cancelled-by-reload: "&c功能重载中，交易已取消"
  already-trading: "&c有玩家正在交易，请等待其结束。"
  money-balance-changed: "&c交易取消：倒计时期间有玩家余额不足，物品已返还。"
  money-settlement-failed: "&c交易取消：支付失败，物品已返还。"
  test-opening: "&e已进入测试模式，可操作双方物品栏和确认按钮。货币与等级不会扣除，结束后返还物品。"
  test-success: "&a测试完成，物品已返还，货币和等级未扣除。"
  test-cancelled: "&e已退出测试模式，物品已返还。"

test-trade:
  invalid-name: "&c测试名称只能使用 1–16 个字母、数字或下划线。"
  player-exists: "&c这个名字已有玩家在线，请换一个测试名称。"
  already-trading: "&c请先结束当前交易或退出测试模式。"

# 交易界面
trade-gui:
  items-offer-changed: "&e%player% &e修改了交易物品，请检查后重新确认。"
  currency-locked: "&c请双方取消确认后再切换币种。"
  confirm: "&a已确认，等待对方确认。"
  unconfirm: "&c你已取消确认交易"
  cancel-ready: "&c你已取消确认状态"
  trade-cancelled: "&e已取消确认，可以继续调整交易内容。"
  items-locked: "&c请先取消确认，再修改物品。"
  self-operation: "&c你只能操作自己一侧的物品和按钮。"
  confirm-in-progress: "&e正在倒计时，点击下方按钮可取消确认。"
  blacklist-hit: "&c你放入了禁止交易的物品，请先取出。"
  money-changed: "&a已调整为 &e%amount%&a。"
  money-offer-changed: "&e%player% &e修改了支付数量，请检查后重新确认。"
  money-insufficient: "&c%player% 无法支付 %amount%。"
  money-locked: "&c请先取消确认，再调整数量。"
  money-minimum: "&c支付数量不能小于 0。"
  money-unavailable: "&c当前交易类型暂不可用。"
  money-invalid: "&c数量无效，请检查是否超出上限或使用了不支持的小数。"

# 默认交易界面按钮；View.yml 中的自定义值会覆盖这些内容
trade-view:
  currency-selected: "&b当前类型：%currency%"
  currency-switch: "&e左键切换类型，已设置的数量会保留"
  unconfirmed-name: "&7当前未确认"
  click-confirm-lore:
    - ""
    - "&a单击可确认"
  confirmed-name: "&e已确认"
  waiting-other-lore:
    - ""
    - "&a等待对方确认"
  countdown-name: "&b交易倒计时……"
  countdown-lore:
    - ""
    - "&e请核对双方物品和支付数量"
    - "&6点击可取消确认"
  other-cancelled-name: "&c对方取消"
  restart-confirm-lore:
    - ""
    - "&e点击重新确认，双方确认后开始倒计时"
  divider-name: "&7交易说明"
  divider-lore:
    - ""
    - "&a发起者放左侧，接收者放右侧"
    - "&e放入物品后，点击下方按钮确认"
    - "&e物品或数量改变后，需要重新确认"
    - "&e双方确认后开始倒计时"
    - "&7关闭界面可取消交易"
  money-button-name: "&6调整数量：&e%amount%"
  money-button-lore:
    - ""
    - "&a左键: 增加 %amount%"
    - "&c右键: 减少 %amount%"
  sender-payment: "&6%player% 需支付: &e%amount%"
  target-payment: "&6%player% 需支付: &e%amount%"
  test-mode: "&b测试模式：不扣除货币和等级，结束后返还物品"

# 交易开关
trade-toggle:
  enabled: "&a你已 &2开启 &a交易接受状态，其他玩家可以向你发起交易"
  disabled: "&c你已 &4关闭 &c交易接受状态，其他玩家无法向你发起交易"

# 玩家相关
player:
  offline: "&c该玩家不在线"
  not-found: "&c找不到这名在线玩家。"
  self-trade: "&c你不能与自己进行交易！"
  different-players: "&c交易必须两个不同玩家！"
  inv-full: "&e背包已满，多余物品已掉落在脚下。"

# 控制台相关
console:
  need-both-players: "请填写发起者和接收者的玩家名。"

# 安全保护
protection:
  trading: "该玩家正在交易，你无法对其造成伤害"

# 安全违规
