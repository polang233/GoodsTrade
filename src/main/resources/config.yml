# Language locale to use. "system" follows the server JVM/operating-system locale.
# 使用的语言区域。"system" 会跟随服务器 JVM/操作系统语言。
# Examples / 示例: system, zh_cn, en_us
Language: system

Trade:
  #交易双方确认后的等待时间（单位秒）
  Wait-Time: 5

  # Vault 金币交易。需要安装 Vault 和一个已接入 Vault 的经济插件。
  Economy:
    Enable: true
    # 开启后，玩家可把自己的报价减为负数；负数等价于要求对方支付。
    Allow-Negative: false
    # 从小到大配置 1-4 档按钮金额；左键增加，右键减少。
    Amounts:
      - 1000
      - 10000

  #什么方式可以发起交易
  Triggers:
    #蹲下加右键快捷发起交易
    Shift-Right-Click: true

  #安全处理
  Safe:
    #是否开启交易期间玩家不受会伤害
    Damage: false
    #交易期间玩家是否阻止移动、被推动等
    Move: false

  #阻止特定物品进行交易
  Item-BlackList:
    #是否开启黑名单
    Enable: false
    #黑名单物品Lore
    Lore:
      - "任意一条符合将无法交易"
      - "禁止交易"
    #黑名单物品名称
    Name:
      - "XXX"
    #黑名单物品NBT
    NBT:
      #格式:
      #  - "NBT"       #存在该NBT时禁止交易
      #  - "键@值"    #指定键对应指定值时阻止交易
      #NBT路径支持用.来嵌套，如果键本身有.可以用转移 //. 来解决
      #例如: "item.isbind@bind"
      - "XXX"
      - "XX@XXXX"
